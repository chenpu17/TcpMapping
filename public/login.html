<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP转发服务器 - 登录</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233b82f6'/%3E%3Cpath d='M6 12h3l2-5 3 10 2-5h2' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script src="/common.js"></script>
    <style>
        :root {
            color-scheme: light;
            --bg-1: #eef2ff;
            --bg-2: #e0f2fe;
            --surface: #ffffff;
            --surface-muted: #f8fafc;
            --text: #0f172a;
            --text-muted: #64748b;
            --text-faint: #94a3b8;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --primary: #6366f1;
            --primary-soft: rgba(99, 102, 241, 0.14);
            --green: #10b981;
            --green-soft: rgba(16, 185, 129, 0.12);
            --red: #ef4444;
            --red-soft: rgba(239, 68, 68, 0.12);
            --gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --shadow-lg: 0 30px 80px -24px rgba(15, 23, 42, 0.35);
            --mono: 'SFMono-Regular', ui-monospace, 'Cascadia Code', Consolas, monospace;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --bg-1: #0b1120;
            --bg-2: #111827;
            --surface: #111827;
            --surface-muted: #0f172a;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
            --border: #1e293b;
            --border-strong: #334155;
            --primary: #818cf8;
            --primary-soft: rgba(129, 140, 248, 0.2);
            --green: #34d399;
            --green-soft: rgba(52, 211, 153, 0.15);
            --red: #f87171;
            --red-soft: rgba(248, 113, 113, 0.15);
            --shadow-lg: 0 40px 90px -24px rgba(0, 0, 0, 0.75);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background:
                radial-gradient(700px 500px at 12% 12%, rgba(99, 102, 241, 0.28), transparent 62%),
                radial-gradient(700px 500px at 88% 82%, rgba(14, 165, 233, 0.24), transparent 60%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: var(--text);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        svg {
            display: block;
        }

        .page {
            width: 100%;
            max-width: 430px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-container {
            position: relative;
            width: 100%;
            background: var(--surface);
            padding: 2.25rem 2rem 2rem;
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.45s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-controls {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface-muted);
            color: var(--text-muted);
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .icon-btn:hover {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border-strong);
        }

        .icon-btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .icon-btn svg {
            width: 16px;
            height: 16px;
        }

        .icon-btn .icon-sun {
            display: none;
        }

        [data-theme="dark"] .icon-btn .icon-moon {
            display: none;
        }

        [data-theme="dark"] .icon-btn .icon-sun {
            display: block;
        }

        .select-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .select-wrap select {
            appearance: none;
            -webkit-appearance: none;
            padding: 0.45rem 1.6rem 0.45rem 0.65rem;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface-muted);
            color: var(--text);
            font-size: 0.75rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
        }

        .select-wrap select:hover {
            border-color: var(--border-strong);
        }

        .select-wrap select:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .select-wrap::after {
            content: '';
            position: absolute;
            right: 0.55rem;
            width: 5px;
            height: 5px;
            border-right: 1.5px solid var(--text-muted);
            border-bottom: 1.5px solid var(--text-muted);
            transform: rotate(45deg) translateY(-1px);
            pointer-events: none;
        }

        .login-header {
            text-align: center;
            margin: 1.5rem 0 1.75rem;
        }

        .login-header .logo {
            width: 64px;
            height: 64px;
            background: var(--gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.1rem;
            box-shadow: 0 16px 36px -12px rgba(99, 102, 241, 0.8);
        }

        .login-header .logo svg {
            width: 32px;
            height: 32px;
            color: #ffffff;
        }

        .login-header h1 {
            color: var(--text);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.35rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text);
            font-weight: 600;
            font-size: 0.8rem;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap > svg {
            position: absolute;
            left: 0.9rem;
            width: 17px;
            height: 17px;
            color: var(--text-faint);
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 2.6rem 0.8rem 2.6rem;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--surface-muted);
            color: var(--text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .toggle-password {
            position: absolute;
            right: 0.55rem;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--text-faint);
            cursor: pointer;
        }

        .toggle-password:hover {
            background: var(--surface-muted);
            color: var(--text);
        }

        .toggle-password:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 1px;
        }

        .toggle-password svg {
            width: 16px;
            height: 16px;
        }

        .toggle-password .icon-eye-off {
            display: none;
        }

        .toggle-password.is-visible .icon-eye {
            display: none;
        }

        .toggle-password.is-visible .icon-eye-off {
            display: block;
        }

        .login-btn {
            width: 100%;
            padding: 0.85rem;
            margin-top: 0.35rem;
            background: var(--gradient);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 650;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
            box-shadow: 0 14px 30px -12px rgba(99, 102, 241, 0.85);
        }

        .login-btn:hover {
            filter: brightness(1.07);
        }

        .login-btn:active {
            transform: translateY(1px);
        }

        .login-btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            filter: none;
            box-shadow: none;
        }

        .error-message,
        .success-message {
            font-size: 0.82rem;
            margin-top: 1rem;
            padding: 0.7rem 0.9rem;
            border-radius: 9px;
            display: none;
            text-align: center;
        }

        .error-message {
            color: var(--red);
            background: var(--red-soft);
        }

        .success-message {
            color: var(--green);
            background: var(--green-soft);
        }

        .help-info {
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            margin-top: 1.4rem;
            font-size: 0.76rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .help-info code {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.1rem 0.4rem;
            border-radius: 5px;
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--primary);
            overflow-wrap: anywhere;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.75rem 1.25rem 1.5rem;
            }

            .login-header {
                margin-top: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="login-container">
            <div class="top-controls">
                <div class="select-wrap">
                    <select id="languageSelect" data-i18n-aria-label="common.language">
                        <option value="zh-CN">中文</option>
                        <option value="en-US">English</option>
                    </select>
                </div>
                <button type="button" class="icon-btn" data-theme-toggle data-i18n-title="common.theme" data-i18n-aria-label="common.theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                </button>
            </div>

            <div class="login-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </div>
                <h1 data-i18n="brand.name">TCP 转发服务器</h1>
                <p data-i18n="login.subtitle">管理界面登录</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" data-i18n="login.username">用户名</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="username" name="username" data-i18n-placeholder="login.usernamePlaceholder" placeholder="请输入用户名" required autocomplete="username" autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="login.password">密码</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" data-i18n-placeholder="login.passwordPlaceholder" placeholder="请输入密码" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword" data-i18n-title="login.showPassword" data-i18n-aria-label="login.showPassword">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn" data-i18n="login.submit">登录</button>

                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
            </form>

            <div class="help-info" data-i18n-html="login.forgot">
                忘记密码？运行 <code>tcpmapping setup-password</code> 或 <code>npm run reset-password</code> 重置
            </div>
        </div>

        <div class="footer">
            <a href="https://github.com/chenpu17/TcpMapping" target="_blank" rel="noopener noreferrer">TcpMapping</a> ·
            <span data-i18n="login.footer">TCP 端口转发服务器</span>
        </div>
    </div>

    <script>
        function t(key, params) {
            return window.I18n ? window.I18n.t(key, params) : key;
        }

        let loginPending = false;

        document.addEventListener('DOMContentLoaded', function() {
            document.title = t('page.login');

            const toggleButton = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            toggleButton.addEventListener('click', function() {
                const visible = passwordInput.type === 'text';
                passwordInput.type = visible ? 'password' : 'text';
                toggleButton.classList.toggle('is-visible', !visible);

                const label = t(visible ? 'login.showPassword' : 'login.hidePassword');
                toggleButton.setAttribute('title', label);
                toggleButton.setAttribute('aria-label', label);
                passwordInput.focus();
            });
        });

        document.addEventListener('languagechange', function() {
            document.title = t('page.login');

            if (loginPending) {
                document.getElementById('loginBtn').textContent = t('login.submitting');
            }

            const toggleButton = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            if (toggleButton && passwordInput) {
                const label = t(passwordInput.type === 'text' ? 'login.hidePassword' : 'login.showPassword');
                toggleButton.setAttribute('title', label);
                toggleButton.setAttribute('aria-label', label);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            loginPending = true;
            loginBtn.disabled = true;
            loginBtn.textContent = t('login.submitting');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Language': window.I18n ? window.I18n.getLanguage() : 'zh-CN'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password })
                });

                let data;
                try {
                    data = await response.json();
                } catch (error) {
                    data = { success: false, message: t('common.invalidResponse') };
                }

                if (data.success) {
                    successMessage.textContent = t('login.success');
                    successMessage.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 700);
                    return;
                }

                errorMessage.textContent = data.message || t('login.failedNetwork');
                errorMessage.style.display = 'block';
            } catch (error) {
                errorMessage.textContent = t('login.failedNetwork');
                errorMessage.style.display = 'block';
            } finally {
                loginPending = false;
                loginBtn.disabled = false;
                loginBtn.textContent = t('login.submit');
            }
        });
    </script>
</body>
</html>
